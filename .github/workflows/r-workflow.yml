name: R Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  _R_CHECK_SYSTEM_CLOCK_: "false"

jobs:
  r-packages:
    name: Module 01 - R packages
    runs-on: ubuntu-24.04
    container:
      image: rocker/r-ver:4.5.1

    steps:
      - uses: actions/checkout@v5

      - name: Install system libraries
        run: |
          apt-get update
          apt-get install -y \
            pandoc qpdf \
            libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff-dev libjpeg-dev

      - name: Install R tooling
        run: Rscript -e 'install.packages(c("devtools", "testthat", "knitr", "rmarkdown"))'

      - name: Install package dependencies
        run: |
          Rscript -e 'devtools::install_deps("01_R_Package_Development/classiccompare", dependencies = TRUE)'
          Rscript -e 'devtools::install_deps("01_R_Package_Development/descriptive_stats", dependencies = TRUE)'

      - name: Check classiccompare
        run: Rscript -e 'devtools::check("01_R_Package_Development/classiccompare", args = "--no-manual", error_on = "warning")'

      - name: Check descriptiveStats
        run: Rscript -e 'devtools::check("01_R_Package_Development/descriptive_stats", args = "--no-manual", error_on = "warning")'

  r-modules:
    name: Module ${{ matrix.number }} - ${{ matrix.label }}
    runs-on: ubuntu-24.04
    container:
      image: rocker/r-ver:4.5.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - number: "02"
            label: SDTM
            path: 02_SDTM_Programming
          - number: "03"
            label: ADaM
            path: 03_ADaM_Programming
          - number: "04"
            label: TLFs
            path: 04_TLG_Generation

    steps:
      - uses: actions/checkout@v5

      - name: Use latest CRAN packages
        run: |
          echo 'options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))' >> "$(R RHOME)/etc/Rprofile.site"

      - name: Install system libraries
        run: |
          apt-get update
          apt-get install -y \
            pandoc qpdf \
            libuv1-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff-dev libjpeg-dev libwebp-dev libcairo2-dev

      - name: Install packages used by this module
        run: |
          Rscript -e 'install.packages("renv")'
          Rscript -e 'pkgs <- unique(renv::dependencies("${{ matrix.path }}")$Package); missing <- setdiff(pkgs, rownames(installed.packages())); if (length(missing)) install.packages(missing)'

      - name: Show key package versions
        run: |
          Rscript -e 'for (p in c("admiral", "pharmaversesdtm", "dplyr", "gt")) if (requireNamespace(p, quietly = TRUE)) cat(p, as.character(packageVersion(p)), "\n")'

      - name: Run R scripts in order
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          for f in $(ls *.R | sort); do
            echo "::group::Running $f"
            Rscript "$f" || exit 1
            echo "::endgroup::"
          done

    shiny-app:
    name: Module 07 - Shiny app smoke test
    runs-on: ubuntu-24.04
    container:
      image: rocker/r-ver:4.5.1

    steps:
      - uses: actions/checkout@v5

      - name: Use latest CRAN packages
        run: |
          echo 'options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))' >> "$(R RHOME)/etc/Rprofile.site"

      - name: Install system libraries
        run: |
          apt-get update
          apt-get install -y \
            curl \
            libuv1-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff-dev libjpeg-dev libwebp-dev libcairo2-dev

      - name: Check deployment files exist
        run: |
          test -f 07_RShiny_Safety_Monitoring_Dashboard/app.R
          test -f 07_RShiny_Safety_Monitoring_Dashboard/manifest.json

      - name: Install packages used by the app
        run: |
          Rscript -e 'install.packages(c("renv", "shiny"))'
          Rscript -e 'pkgs <- unique(renv::dependencies("07_RShiny_Safety_Monitoring_Dashboard/app.R")$Package); missing <- setdiff(pkgs, rownames(installed.packages())); if (length(missing)) install.packages(missing)'

      - name: Smoke test - app starts and responds
        shell: bash
        run: |
          Rscript -e 'shiny::runApp("07_RShiny_Safety_Monitoring_Dashboard", host = "127.0.0.1", port = 3838, launch.browser = FALSE)' > app.log 2>&1 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3838/ || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          echo "---- app log ----"
          cat app.log
          kill $APP_PID || true
          if [ "$ok" != "1" ]; then
            echo "App did not return HTTP 200"
            exit 1
          fi
          echo "App responded OK"